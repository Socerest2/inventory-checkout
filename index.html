<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Check Out</title>
<style>
  :root { --text: #1f2328; --muted: #6b7280; --line: #d9dde3; --accent: #0b3d91; --bg: #fff; --row: #f6f8fa; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg); }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 16px 64px; }
  nav { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 48px; }
  nav button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; font-family: inherit; font-weight: 600; font-size: 20px; color: var(--muted); cursor: pointer; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  h2 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; margin: 40px 0 10px; }
  input, select, button { font-family: inherit; }
  input, select, button.primary { font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--text); }
  #filter { width: 100%; max-width: 360px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  #co-item { width: 220px; }
  #co-qty { width: 80px; text-align: right; }
  #co-name, #co-netid, #co-event { width: 150px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  button.small { font-size: 14px; padding: 5px 10px; border: 1px solid var(--accent); color: var(--accent); background: #fff; border-radius: 4px; cursor: pointer; }
  .status { color: var(--muted); margin: 8px 0; min-height: 1.2em; }
  .status.err { color: #b42318; }
  .status.ok { color: #067647; }
  #items { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; margin-top: 8px; max-width: 640px; }
  #items:empty { display: none; }
  .item { display: flex; justify-content: space-between; gap: 12px; padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--row); }
  .item:hover, .item.sel { background: #e8eef9; }
  .item small { color: var(--muted); white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); font-size: 14px; }
  .tag { font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 3px; }
  .tag.OUT { background: #fef0c7; color: #93370d; }
  .tag.IN { background: #dcfae6; color: #067647; }
  @media (max-width: 640px) {
    nav button { font-size: 17px; }
    #co-item, #co-name, #co-netid, #co-event, #filter { width: 100%; max-width: none; }
    .table-wrap { overflow-x: auto; }
  }
</style>
</head>
<body>
<main>
  <nav id="tabs"></nav>

  <h2>Items</h2>
  <input id="filter" placeholder="Filter items" autocomplete="off">
  <div id="items-status" class="status">Loading...</div>
  <div id="items"></div>

  <h2>Check out</h2>
  <form id="checkout" class="row" autocomplete="off">
    <select id="co-item" required></select>
    <input id="co-qty" type="number" min="1" value="1" required>
    <input id="co-name" placeholder="Name" required>
    <input id="co-netid" placeholder="NetID" list="netids" required>
    <input id="co-event" placeholder="Event" list="events">
    <button class="primary" type="submit">Check out</button>
  </form>
  <datalist id="netids"></datalist>
  <datalist id="events"></datalist>
  <div id="co-status" class="status"></div>

  <h2>Checked out now</h2>
  <div class="table-wrap" id="out"></div>

  <h2>Recent activity</h2>
  <div class="table-wrap" id="recent"></div>
</main>

<script src="config.js"></script>
<script>
const OFFICES = ['OFSA Office', 'DM Office'];
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let office = OFFICES.includes(store.get('office')) ? store.get('office') : OFFICES[0];
let data = { items: [], out: [], recent: [], people: {}, events: [] };

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const label = it => it.name + (it.box ? ` (${it.box})` : '');
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };

async function api(method, payload) {
  if (!window.API_URL) throw new Error('API_URL is not set in config.js');
  const res = method === 'GET'
    ? await fetch(`${API_URL}?office=${encodeURIComponent(payload.office)}`)
    // text/plain avoids a CORS preflight, which Apps Script can't answer.
    : await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

function renderTabs() {
  $('tabs').innerHTML = OFFICES.map(o => `<button class="${o === office ? 'active' : ''}">${esc(o)}</button>`).join('');
  [...$('tabs').children].forEach((b, i) => b.onclick = () => { office = OFFICES[i]; store.set('office', office); load(); });
}

function filtered() {
  const q = $('filter').value.trim().toLowerCase();
  return data.items.map((it, i) => ({ ...it, i })).filter(it => !q || label(it).toLowerCase().includes(q));
}

function renderItems() {
  const list = filtered();
  const sel = $('co-item').value;
  $('items').innerHTML = list.map(it =>
    `<div class="item${String(it.i) === sel ? ' sel' : ''}" data-i="${it.i}"><span>${esc(it.name)}</span><small>${esc([it.qty, it.box].filter(Boolean).join(' · '))}</small></div>`
  ).join('');
  $('items-status').textContent = data.items.length ? `${list.length} of ${data.items.length} items` : 'No items';
  $('co-item').innerHTML = `<option value=""></option>` + list.map(it =>
    `<option value="${it.i}"${String(it.i) === sel ? ' selected' : ''}>${esc(label(it))}</option>`).join('');
  // Narrowed to one match: pick it automatically.
  if (list.length === 1) $('co-item').value = String(list[0].i);
}

function table(rows, withButton) {
  if (!rows.length) return '<div class="empty">Nothing here.</div>';
  return `<table><thead><tr><th>Item</th><th>Qty</th><th>Name</th><th>NetID</th><th>Event</th><th>${withButton ? 'Out since' : 'Status'}</th>${withButton ? '<th></th>' : ''}</tr></thead><tbody>` +
    rows.map(r => `<tr><td>${esc(r.item)}${r.box ? `<br><small class="empty">${esc(r.box)}</small>` : ''}</td><td>${esc(r.qty)}</td><td>${esc(r.name)}</td><td>${esc(r.netid)}</td><td>${esc(r.event)}</td>` +
      (withButton
        ? `<td>${when(r.out)}</td><td><button class="small" data-id="${esc(r.id)}">Check in</button></td>`
        : `<td><span class="tag ${esc(r.status)}">${esc(r.status)}</span> ${when(r.status === 'IN' ? r.in : r.out)}</td>`) +
      '</tr>').join('') + '</tbody></table>';
}

function render() {
  renderItems();
  $('out').innerHTML = table(data.out, true);
  $('recent').innerHTML = table(data.recent, false);
  $('netids').innerHTML = Object.entries(data.people).map(([id, n]) => `<option value="${esc(id)}">${esc(n)}</option>`).join('');
  $('events').innerHTML = data.events.map(e => `<option value="${esc(e)}">`).join('');
}

async function load() {
  renderTabs();
  $('items-status').className = 'status';
  $('items-status').textContent = 'Loading...';
  $('items').innerHTML = '';
  try {
    data = await api('GET', { office });
    render();
  } catch (err) {
    $('items-status').className = 'status err';
    $('items-status').textContent = 'Could not load: ' + err.message;
  }
}

function flash(msg, cls) { $('co-status').className = 'status ' + cls; $('co-status').textContent = msg; }

$('filter').oninput = renderItems;
$('items').onclick = e => {
  const el = e.target.closest('.item');
  if (!el) return;
  $('co-item').value = el.dataset.i;
  renderItems();
  $('co-qty').focus();
};
$('co-item').onchange = renderItems;

// Autofill: last-used person and event; known NetID fills the name.
$('co-name').value = store.get('name');
$('co-netid').value = store.get('netid');
$('co-event').value = store.get('event');
$('co-netid').oninput = () => {
  const n = data.people[$('co-netid').value.trim().toLowerCase()];
  if (n) $('co-name').value = n;
};

$('checkout').onsubmit = async e => {
  e.preventDefault();
  const it = data.items[$('co-item').value];
  if (!it) return flash('Pick an item first.', 'err');
  const btn = e.submitter; btn.disabled = true;
  const body = {
    action: 'checkout', office, item: it.name, box: it.box, qty: $('co-qty').value,
    name: $('co-name').value, netid: $('co-netid').value, event: $('co-event').value,
  };
  try {
    await api('POST', body);
    ['name', 'netid', 'event'].forEach(k => store.set(k, body[k]));
    flash(`Checked out ${body.qty} × ${it.name}.`, 'ok');
    $('co-qty').value = 1; $('co-item').value = ''; $('filter').value = '';
    await load();
  } catch (err) {
    flash('Check out failed: ' + err.message, 'err');
  } finally { btn.disabled = false; }
};

$('out').onclick = async e => {
  const btn = e.target.closest('button[data-id]');
  if (!btn) return;
  btn.disabled = true; btn.textContent = 'Checking in...';
  try {
    await api('POST', { action: 'checkin', id: btn.dataset.id });
    flash('Checked in.', 'ok');
    await load();
  } catch (err) {
    flash('Check in failed: ' + err.message, 'err');
    btn.disabled = false; btn.textContent = 'Check in';
  }
};

load();
</script>
</body>
</html>
