<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Inventory Check Out</title>
<style>
  :root { --text: #1f2328; --muted: #6b7280; --line: #d9dde3; --accent: #0b3d91; --bg: #fff; --row: #f6f8fa; --err: #b42318; --ok: #067647; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg); -webkit-text-size-adjust: 100%; }
  main { max-width: 820px; margin: 0 auto; padding: 12px 16px 104px; }
  input, select, button { font-family: inherit; }
  [hidden] { display: none !important; }

  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 0 16px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 10px; font-weight: 600; font-size: 18px; color: var(--muted); cursor: pointer; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }

  h2 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; margin: 28px 0 10px; }
  input { font-size: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); width: 100%; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .search { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 4px 0 8px; }
  .status { color: var(--muted); font-size: 14px; margin: 6px 0; min-height: 1.2em; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .empty { color: var(--muted); font-size: 14px; margin: 4px 0; }

  .list { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .list:empty { display: none; }
  .items { max-height: 60vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 56px; border-bottom: 1px solid var(--row); }
  .row:last-child { border-bottom: 0; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 500; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

  button { cursor: pointer; }
  button.add { flex: none; border: 1px solid var(--accent); color: var(--accent); background: #fff; border-radius: 999px; padding: 0 16px; height: 40px; font-size: 15px; font-weight: 600; }
  .stepper { flex: none; display: flex; align-items: center; border: 1px solid var(--accent); border-radius: 999px; overflow: hidden; background: #fff; }
  .stepper button { width: 40px; height: 40px; border: 0; background: none; color: var(--accent); font-size: 22px; line-height: 1; }
  .stepper span { min-width: 28px; text-align: center; font-weight: 600; }
  .stepper input { width: 56px; height: 40px; border: 0; border-radius: 0; padding: 0; text-align: center; font-weight: 600; -moz-appearance: textfield; }
  .stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  button.icon { flex: none; width: 40px; height: 40px; border: 0; background: none; color: var(--muted); font-size: 24px; line-height: 1; }
  button.primary { background: var(--accent); border: 1px solid var(--accent); color: #fff; font-weight: 600; font-size: 16px; border-radius: 8px; padding: 0 20px; min-height: 48px; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.secondary { flex: none; border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 8px; padding: 0 12px; height: 40px; font-size: 14px; white-space: nowrap; }
  button.secondary:disabled { opacity: .6; }

  .person { display: grid; gap: 10px; margin-top: 12px; }
  .card { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
  .card-head { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--row); border-bottom: 1px solid var(--line); }
  .tag { flex: none; font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 3px; }
  .tag.OUT { background: #fef0c7; color: #93370d; }
  .tag.IN { background: #dcfae6; color: var(--ok); }

  .cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
  .cartbar span { font-weight: 600; }
  .footer { margin-top: 40px; font-size: 13px; }
  .footer a { color: var(--muted); }

  @media (min-width: 700px) {
    main { padding-top: 24px; }
    .tabs button { font-size: 20px; padding: 12px; }
    .items { max-height: 420px; }
    .person { grid-template-columns: 1fr 1fr 1fr auto; }
  }
</style>
</head>
<body>
<main>
  <nav class="tabs" id="tabs"></nav>

  <section>
    <h2>Items</h2>
    <div class="search">
      <input id="filter" type="search" placeholder="Search items" autocomplete="off" enterkeyhint="search">
      <div id="items-status" class="status">Loading...</div>
    </div>
    <div id="items" class="list items"></div>
  </section>

  <section id="cart-section">
    <h2>Check out <span id="cart-count"></span></h2>
    <div id="cart-empty" class="empty">Tap <b>+ Add</b> on items above. You can add as many as you need, from any office tab.</div>
    <div id="cart" class="list"></div>
    <form id="checkout" class="person" autocomplete="off">
      <input id="co-name" placeholder="Name" autocomplete="name" enterkeyhint="next" required>
      <input id="co-netid" placeholder="NetID" list="netids" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" required>
      <input id="co-event" placeholder="Event" list="events" enterkeyhint="done">
      <button class="primary" type="submit" id="co-btn" disabled>Check out</button>
    </form>
    <datalist id="netids"></datalist>
    <datalist id="events"></datalist>
    <div id="co-status" class="status"></div>
  </section>

  <h2>Checked out now</h2>
  <div id="out"></div>

  <h2>Recent activity</h2>
  <div id="recent" class="list"></div>
  <p id="recent-empty" class="empty" hidden>No activity yet.</p>

  <p class="footer"><a id="admin-link" hidden>Admin</a></p>
</main>

<div class="cartbar" id="cartbar" hidden>
  <span id="cartbar-text"></span>
  <button class="primary" id="cartbar-btn" type="button">Review &amp; check out</button>
</div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
// Office list and settings come from the backend (managed in the admin portal).
let offices = [];
let office = store.get('office');
let data = { items: [], out: [], recent: [], people: {}, events: [], config: {} };
// Cart lines: {office, item, box, qty}. Kept across reloads and office tabs.
let cart = [];
try { cart = JSON.parse(store.get('cart') || '[]'); } catch {}
let cartInView = false;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

async function api(method, payload) {
  if (!window.API_URL) throw new Error('API_URL is not set in config.js');
  const res = method === 'GET'
    ? await fetch(`${API_URL}?office=${encodeURIComponent(payload.office)}`)
    // text/plain avoids a CORS preflight, which Apps Script can't answer.
    : await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

function renderTabs() {
  $('tabs').innerHTML = offices.map(o => `<button class="${o === office ? 'active' : ''}">${esc(o)}</button>`).join('');
  [...$('tabs').children].forEach((b, i) => b.onclick = () => { office = offices[i]; store.set('office', office); $('filter').value = ''; load(); });
}

// ---------- Cart ----------

const cartLine = (off, item, box) => cart.find(c => c.office === off && c.item === item && c.box === box);

function changeQty(line, delta) {
  line.qty = Math.max(0, (Number(line.qty) || 0) + delta);
  if (!line.qty) cart = cart.filter(c => c !== line);
  saveCart();
}

function saveCart() {
  store.set('cart', JSON.stringify(cart));
  renderCart();
  renderItems();
}

function stepper(qty, editable) {
  const mid = editable
    ? `<input type="number" inputmode="numeric" min="1" value="${esc(qty)}" aria-label="Quantity">`
    : `<span>${esc(qty)}</span>`;
  return `<div class="stepper"><button type="button" data-d="-1" aria-label="One fewer">−</button>${mid}<button type="button" data-d="1" aria-label="One more">+</button></div>`;
}

function renderCart() {
  $('cart-count').textContent = cart.length ? `(${cart.length})` : '';
  $('cart-empty').hidden = cart.length > 0;
  $('cart').innerHTML = cart.map((c, i) =>
    `<div class="row" data-c="${i}"><div class="grow"><div class="name">${esc(c.item)}</div><div class="meta">${esc([c.office, c.box].filter(Boolean).join(' · '))}</div></div>` +
    stepper(c.qty, true) + `<button type="button" class="icon" data-remove aria-label="Remove ${esc(c.item)}">×</button></div>`).join('');
  $('co-btn').textContent = cart.length ? `Check out ${plural(cart.length, 'item')}` : 'Check out';
  $('co-btn').disabled = !cart.length;
  $('cartbar-text').textContent = `${plural(cart.length, 'item')} in cart`;
  updateBar();
}

function updateBar() { $('cartbar').hidden = !cart.length || cartInView; }

$('cart').onclick = e => {
  const row = e.target.closest('[data-c]');
  if (!row) return;
  const line = cart[row.dataset.c];
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.hasAttribute('data-remove')) { cart = cart.filter(c => c !== line); saveCart(); }
  else changeQty(line, Number(btn.dataset.d));
};
$('cart').onchange = e => {
  if (e.target.tagName !== 'INPUT') return;
  const line = cart[e.target.closest('[data-c]').dataset.c];
  line.qty = Math.max(1, Math.floor(Number(e.target.value)) || 1);
  saveCart();
};

// ---------- Items ----------

function renderItems() {
  const q = $('filter').value.trim().toLowerCase();
  const list = data.items.map((it, i) => ({ ...it, i })).filter(it => !q || `${it.name} ${it.box}`.toLowerCase().includes(q));
  if (data.items.length) $('items-status').textContent = q ? `${list.length} of ${plural(data.items.length, 'item')}` : plural(data.items.length, 'item');
  $('items').innerHTML = list.map(it => {
    const line = cartLine(office, it.name, it.box);
    return `<div class="row" data-i="${it.i}"><div class="grow"><div class="name">${esc(it.name)}</div><div class="meta">${esc([it.qty, it.box].filter(Boolean).join(' · '))}</div></div>` +
      (line ? stepper(line.qty) : `<button type="button" class="add" data-d="1" aria-label="Add ${esc(it.name)}">+ Add</button>`) + '</div>';
  }).join('');
}

$('items').onclick = e => {
  const btn = e.target.closest('button[data-d]');
  if (!btn) return;
  const it = data.items[btn.closest('[data-i]').dataset.i];
  const line = cartLine(office, it.name, it.box);
  if (line) return changeQty(line, Number(btn.dataset.d));
  cart.push({ office, item: it.name, box: it.box, qty: 1 });
  saveCart();
};
$('filter').oninput = renderItems;

// ---------- Checked out / recent ----------

function renderOut() {
  if (!data.out.length) { $('out').innerHTML = '<p class="empty">Nothing checked out.</p>'; return; }
  // One card per person, newest first.
  const groups = new Map();
  data.out.forEach(l => {
    const k = `${l.netid}|${l.name}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(l);
  });
  $('out').innerHTML = [...groups.values()].map(g => {
    const first = g[0];
    const events = [...new Set(g.map(l => l.event).filter(Boolean))].join(', ');
    return `<div class="card"><div class="card-head"><div class="grow"><div class="name">${esc(first.name)} <span class="meta">${esc(first.netid)}</span></div>` +
      `<div class="meta">${esc([events, 'out since ' + when(g[g.length - 1].out)].filter(Boolean).join(' · '))}</div></div>` +
      (g.length > 1 ? `<button type="button" class="secondary" data-ids="${esc(g.map(l => l.id).join(','))}">Check in all ${g.length}</button>` : '') + '</div>' +
      g.map(l => `<div class="row"><div class="grow"><span class="name">${esc(l.item)}</span> <span class="meta">×${esc(l.qty)}</span><div class="meta">${esc([l.office, l.box].filter(Boolean).join(' · '))}</div></div>` +
        `<button type="button" class="secondary" data-ids="${esc(l.id)}">Check in</button></div>`).join('') + '</div>';
  }).join('');
}

function renderRecent() {
  $('recent-empty').hidden = data.recent.length > 0;
  $('recent').innerHTML = data.recent.map(l =>
    `<div class="row"><span class="tag ${esc(l.status)}">${esc(l.status)}</span><div class="grow"><span class="name">${esc(l.item)}</span> <span class="meta">×${esc(l.qty)}</span>` +
    `<div class="meta">${esc(l.name)} · ${esc(l.office)} · ${when(l.status === 'IN' ? l.in : l.out)}</div></div></div>`).join('');
}

$('out').onclick = async e => {
  const btn = e.target.closest('button[data-ids]');
  if (!btn) return;
  const ids = btn.dataset.ids.split(',');
  $('out').querySelectorAll('button').forEach(b => b.disabled = true);
  btn.textContent = 'Checking in...';
  try {
    await api('POST', { action: 'checkin', ids });
    flash(`Checked in ${plural(ids.length, 'item')}.`, 'ok');
  } catch (err) {
    flash('Check in failed: ' + err.message, 'err');
  }
  await load();
};

// ---------- Load / submit ----------

function render() {
  renderItems();
  renderCart();
  renderOut();
  renderRecent();
  $('netids').innerHTML = Object.entries(data.people).map(([id, n]) => `<option value="${esc(id)}">${esc(n)}</option>`).join('');
  $('events').innerHTML = data.events.map(e => `<option value="${esc(e)}">`).join('');
}

async function load() {
  renderTabs();
  $('items-status').className = 'status';
  $('items-status').textContent = 'Loading...';
  try {
    data = await api('GET', { office });
    offices = data.config.offices;
    office = data.office;
    store.set('office', office);
    document.title = data.config.title;
    $('co-event').required = data.config.requireEvent;
    $('co-event').placeholder = data.config.requireEvent ? 'Event (required)' : 'Event';
    renderTabs();
    render();
  } catch (err) {
    $('items-status').className = 'status err';
    $('items-status').textContent = 'Could not load: ' + err.message;
  }
}

function flash(msg, cls) { $('co-status').className = 'status ' + cls; $('co-status').textContent = msg; }

// Autofill: last-used person and event; a known NetID fills the name.
$('co-name').value = store.get('name');
$('co-netid').value = store.get('netid');
$('co-event').value = store.get('event');
$('co-netid').oninput = () => {
  const n = data.people[$('co-netid').value.trim().toLowerCase()];
  if (n) $('co-name').value = n;
};

$('checkout').onsubmit = async e => {
  e.preventDefault();
  if (!cart.length) return flash('Add at least one item.', 'err');
  const btn = $('co-btn');
  btn.disabled = true;
  btn.textContent = 'Checking out...';
  const body = {
    action: 'checkout',
    items: cart.map(c => ({ office: c.office, item: c.item, box: c.box, qty: c.qty })),
    name: $('co-name').value, netid: $('co-netid').value, event: $('co-event').value,
  };
  try {
    await api('POST', body);
    ['name', 'netid', 'event'].forEach(k => store.set(k, body[k]));
    flash(`Checked out ${plural(body.items.length, 'item')} to ${body.name.trim()}.`, 'ok');
    cart = [];
    $('filter').value = '';
    saveCart();
    await load();
  } catch (err) {
    flash('Check out failed: ' + err.message, 'err');
    renderCart();
  }
};

$('cartbar-btn').onclick = () => {
  $('cart-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  const empty = ['co-name', 'co-netid'].find(id => !$(id).value.trim());
  if (empty) setTimeout(() => $(empty).focus({ preventScroll: true }), 400);
};
// Hide the bottom cart bar while the cart itself is on screen.
if ('IntersectionObserver' in window) {
  new IntersectionObserver(([entry]) => { cartInView = entry.isIntersecting; updateBar(); }).observe($('cart-section'));
}

if (window.ADMIN_URL) { $('admin-link').href = ADMIN_URL; $('admin-link').hidden = false; }
renderCart();
load();
</script>
</body>
</html>
